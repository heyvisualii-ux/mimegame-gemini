<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>PantoMix | پانتومیکس</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: linear-gradient(180deg, #f4ff57 0%, #faffd0 45%, #ffffff 100%);
        color: #0b0d12;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        width: 100%;
        max-width: 340px;
        background: #ffffff;
        border-radius: 28px;
        padding: 28px 22px;
        box-shadow: 0 12px 36px rgba(15, 23, 42, 0.08);
        border: 1px solid rgba(15, 23, 42, 0.07);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 900;
      }
      p {
        margin: 0 0 20px;
        font-size: 13px;
        line-height: 1.7;
        color: #475569;
      }
      button {
        width: 100%;
        height: 48px;
        border: none;
        border-radius: 16px;
        background: #0b0d12;
        color: #ffffff;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>پانتومیکس (PantoMix)</h1>
      <p>
        برای اجرای بازی و استفاده از هوش مصنوعی، لطفاً اتصال اینترنت گوشی خود را بررسی کنید و دوباره تلاش نمایید.
      </p>
      <button onclick="window.location.href='https://game.dresmaeiliclinic.ir/'">
        تلاش مجدد برای اتصال
      </button>
    </div>
  </body>
</html>
